# This workflow tests that the dev container configuration within
# opensafely/research-template is correct with respect to the tests within
# `tests/dev_container.sh`. Notice that the dev container configuration lives in a
# different repository. This is because opensafely/research-template is a template
# repository; its contents are copied to multiple other repositories. Rather than test
# the dev container configuration in each of these multiple other repositories, we test
# it here, and assume that the copies don't deviate from the template repository. Doing
# so reduces the cost of updating the tests.
name: Test research template dev container

on:
  schedule:
    - cron: "18 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-container:
    runs-on: ubuntu-22.04
    steps:
      # This repository indicates which operating system is used in Codespaces.
      - name: Checkout Codespaces host images repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'github/codespaces-host-images'
          path: 'codespaces-host-images'
          persist-credentials: false

      # We do not run these tests in Codespaces (see #103).
      # For better consistency, ensure that we use the same operating system
      # in this test, as runs in Codespaces.
      - name: Check Codespaces host OS matches GitHub Actions runner
        shell: bash
        run: |
          set -euo pipefail

          codespaces_os=$(
            sed -n '/^## Stable$/,$ { s/^\*\*Host OS\*\*: //p; }' codespaces-host-images/README.md | head -n 1
          )

          if [[ -z "$codespaces_os" ]]; then
            echo "::error::Could not find \"Host OS\" text in Stable section of codespaces-host-images README.md"
            exit 1
          fi

          codespaces_version=$(echo "$codespaces_os" | grep -oE '[0-9]+\.[0-9]+' | head -n 1)
          runner_version=$(lsb_release -rs | cut -d. -f1,2)

          echo "Codespaces Stable Ubuntu version: $codespaces_version"
          echo "GitHub Actions Ubuntu version:    $runner_version"

          if [[ "$codespaces_version" != "$runner_version" ]]; then
            echo "::error::Codespaces Stable uses Ubuntu $codespaces_version, but GitHub Actions uses Ubuntu $runner_version"
            exit 1
          fi

      - name: Checkout research-template repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'opensafely/research-template'
          persist-credentials: false

      - name: Checkout research-template-docker repository in subdirectory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'research-template/research-template-docker'
          persist-credentials: false

      - name: Test dev container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          runCmd: ./research-template/research-template-docker/tests/dev_container.sh

      - name: Notify Slack on failure
        if: failure() && github.event_name == 'schedule'
        uses: zuplo/github-action-slack-notify-build@cf8e7e66a21d76a8125ea9648979c30920195552 # v2
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel_id: C0A8AJA249K
          status: "Scheduled dev container test run failure"
          color: danger
